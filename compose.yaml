services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: balog
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
      - "3307:3306"
    volumes:
      - balog-mysql:/var/lib/mysql

  redis:
    image: redis:7
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
      - "6380:6379"
    volumes:
      - balog-redis:/data

  balog:
    build: .
    env_file: .env
    environment:
      MYSQL_URL: jdbc:mysql://mysql:3306/balog
      MYSQL_USERNAME: root
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8080:8080"

volumes:
  balog-mysql:
  balog-redis:
